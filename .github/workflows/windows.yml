name: Windows Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Normalize Expo SDK dependencies
        run: npx expo install --fix --npm
      - name: Generate audio samples
        run: npm run samples
      - name: Export Expo web app
        run: npm run web:export
      - name: Build Windows installer and portable app
        run: npx electron-builder --win
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beatforge-windows
          path: release/*
