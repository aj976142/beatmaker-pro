name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Do not enable Gradle caching here: the Android Gradle project is
      # generated later by Expo prebuild, so setup-java cannot find Gradle files yet.
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Normalize Expo SDK dependencies
        run: npx expo install --fix --npm

      - name: Generate audio samples
        run: npm run samples

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Make Gradle executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace --warning-mode all

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: beatforge-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
